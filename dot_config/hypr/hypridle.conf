# Call your locking utilities directly as normal shell commands
$lock_cmd = qs -p $HOME/.config/quickshell-active ipc call lock lock >/dev/null 2>&1 || qs -p $(readlink -f $HOME/.config/quickshell-active) ipc call lock lock >/dev/null 2>&1
$suspend_cmd = systemctl suspend || loginctl suspend

general {
    lock_cmd = $lock_cmd
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms("on")' || hyprctl dispatch dpms on
    inhibit_sleep = 3
}

general {
    lock_cmd = pidof hyprlock || hyprlock 
    before_sleep_cmd = loginctl lock-session && curl -X POST http://localhost:27467/api/v1/lighting/power/off
    after_sleep_cmd = hyprctl dispatch dpms on && curl -X POST http://localhost:27467/api/v1/lighting/power/on
}

listener {
    timeout = 180 # 3mins
    on-timeout = loginctl lock-session
}

listener {
    timeout = 180 # 3mins
    on-timeout = hyprctl dispatch 'hl.dsp.dpms("off")' || hyprctl dispatch dpms off
    on-resume = hyprctl dispatch 'hl.dsp.dpms("on")' || hyprctl dispatch dpms on
}

# Suspend listener disabled: sleep/suspend causes AMD USB xHCI controller reset
# and drops power/connection to USB devices (QK100 keyboard).
# Screen blanking (DPMS off) is handled above.

